name: Web — CI

# Sin filtro de rutas a proposito: este check es obligatorio en la ruleset de
# 'main'. Un trigger con 'paths' no se ejecuta cuando el PR no toca esas rutas,
# el check nunca reporta y el PR queda bloqueado para siempre.
on:
  pull_request:
    branches: ['main']

defaults:
  run:
    working-directory: apps/web

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://apistandurl.webadir.es' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://standurl.webadir.es' }}
