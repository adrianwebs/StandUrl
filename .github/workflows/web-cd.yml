name: publish

# Con filtro de rutas: un merge que solo toca documentacion o apps/api no debe
# reconstruir ni redesplegar la web en produccion.
on:
  push:
    branches: ['main']
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-cd.yml'
  workflow_dispatch:   # permite redesplegar a mano desde la pestana Actions

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: adrianwebs/standurl-web:latest

jobs:
  publish:
    name: publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Publish
        run: |
          docker build apps/web \
            --file apps/web/Dockerfile \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://apistandurl.webadir.es' }} \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://standurl.webadir.es' }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

  deploy:
    needs: publish
    name: deploy image
    runs-on: ubuntu-latest

    steps:
      - name: install ssh keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: connect and pull
        run: ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.WORK_DIR || '/docker/clientes/standurl/web' }} && (docker compose pull || docker compose -f docker-compose.prod.yml pull) && (docker compose up -d || docker compose -f docker-compose.prod.yml up -d) && exit"

      - name: cleanup
        run: rm -rf ~/.ssh
