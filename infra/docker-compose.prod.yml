version: '3.9'

# ── Producción: web + api + redis + traefik ──────────────────────────────────
# La BD está en el servidor externo 51.195.47.36 (SQL Server managed)
# Redis sí corre en el servidor para cache de redirects
#
# Variables de entorno requeridas en el archivo .env en el servidor:
#   WEB_IMAGE        ghcr.io/TU_ORG/standurl-web:latest
#   API_IMAGE        ghcr.io/TU_ORG/standurl-api:latest  (o ACR)
#   DOMAIN           standurl.com
#   API_DOMAIN       api.standurl.com
#   ACME_EMAIL       tu@email.com
#   JWT_SECRET       (secreto largo, 64+ chars)
#   SMTP_HOST        ssl0.ovh.net
#   SMTP_PORT        465
#   SMTP_USE_SSL     true
#   SMTP_USER        adrian@webadir.es
#   SMTP_PASSWORD    tu_password
#   SMTP_FROM_EMAIL  adrian@webadir.es
#   SMTP_FROM_NAME   StandUrl
#   NOTIFICATION_EMAIL  dev@standurl.com

services:
  # ── Traefik (reverse proxy + SSL) ─────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    container_name: standurl-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - standurl-net

  # ── Next.js (landing + futuro dashboard) ──────────────────────────────────
  web:
    image: ${WEB_IMAGE}
    container_name: standurl-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://${API_DOMAIN}
      - NEXT_PUBLIC_SITE_URL=https://${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      # Redirect www → apex
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.(.+)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.routers.web.middlewares=www-redirect"
    networks:
      - standurl-net
    depends_on:
      - traefik

  # ── ASP.NET Core API ────────────────────────────────────────────────────────
  api:
    image: ${API_IMAGE}
    container_name: standurl-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Connection string inyectada como variable de entorno (sobreescribe appsettings)
      - ConnectionStrings__DefaultConnection=Server=51.195.47.36;initial catalog=StandUrlProd;persist security info=True;user id=sa;password=0D'1YQgpFHmYCQ!`ibHY;multipleactiveresultsets=True;application name=EntityFramework;Encrypt=false;
      - Redis__ConnectionString=redis:6379
      - Jwt__Secret=${JWT_SECRET}
      - Cors__AllowedOrigins__0=https://${DOMAIN}
      - Cors__AllowedOrigins__1=https://standurl.webadir.es
      - Cors__AllowedOrigins__2=https://standurl.com
      - Cors__AllowedOrigins__3=https://www.standurl.com
      - Smtp__Host=${SMTP_HOST:-ssl0.ovh.net}
      - Smtp__Port=${SMTP_PORT:-465}
      - Smtp__UseSsl=${SMTP_USE_SSL:-true}
      - Smtp__User=${SMTP_USER}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__FromEmail=${SMTP_FROM_EMAIL:-adrian@webadir.es}
      - Smtp__FromName=${SMTP_FROM_NAME:-StandUrl}
      - Smtp__NotificationEmail=${NOTIFICATION_EMAIL:-dev@standurl.com}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    networks:
      - standurl-net
    depends_on:
      - redis
      - traefik

  # ── Redis (cache de redirects) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: standurl-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - standurl-net

volumes:
  traefik-certs:
  redis-data:

networks:
  standurl-net:
    driver: bridge
