version: '3.8'

services:
  web:
    image: ghcr.io/adrianwebs/standurl-web:latest
    container_name: standurl-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://apistandurl.webadir.es
      - NEXT_PUBLIC_SITE_URL=https://standurl.webadir.es
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.standurl-web.rule=Host(`standurl.webadir.es`) || Host(`standurl.com`) || Host(`www.standurl.com`)"
      - "traefik.http.routers.standurl-web.entrypoints=websecure"
      - "traefik.http.routers.standurl-web.tls=true"
      - "traefik.http.routers.standurl-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.standurl-web.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
