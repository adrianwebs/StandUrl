version: '3.9'

# ── StandUrl Web Next.js (Producción) ─────────────────────────────────────────
# Ubicación en servidor: /docker/clientes/standurl/web/docker-compose.prod.yml
# Se conecta a la red externa 'proxy' donde ya corre Traefik

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/adrianwebs/standurl-web:latest}
    container_name: standurl-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://${API_DOMAIN:-apistandurl.webadir.es}
      - NEXT_PUBLIC_SITE_URL=https://${DOMAIN:-standurl.webadir.es}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Router HTTPS (compatible con entrypoint 'websecure' o 'https')
      - "traefik.http.routers.standurl-web-secure.rule=Host(`${DOMAIN:-standurl.webadir.es}`)"
      - "traefik.http.routers.standurl-web-secure.entrypoints=websecure,https"
      - "traefik.http.routers.standurl-web-secure.tls=true"
      - "traefik.http.routers.standurl-web-secure.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.standurl-web-secure.service=standurl-web-svc"
      # Router HTTP (compatible con entrypoint 'web' o 'http')
      - "traefik.http.routers.standurl-web-http.rule=Host(`${DOMAIN:-standurl.webadir.es}`)"
      - "traefik.http.routers.standurl-web-http.entrypoints=web,http"
      - "traefik.http.routers.standurl-web-http.service=standurl-web-svc"
      # Definición explícita del servicio al puerto 3000
      - "traefik.http.services.standurl-web-svc.loadbalancer.server.port=3000"
    networks:
      - proxy

networks:
  proxy:
    external: true
